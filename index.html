<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>BioCrisis</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; touch-action: none; }
      /* El escenario respeta las zonas seguras (muescas, esquinas redondeadas) y la altura dinámica del navegador móvil. */
      #stage { position: fixed; top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px); }
      #game { width: 100%; height: 100%; }
      #game canvas { image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; display: block; }
    </style>
  </head>
  <body>
    <div id="stage"><div id="game"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
